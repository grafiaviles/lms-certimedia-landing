name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm install (no ci) para tolerar drift menor del lock entre versiones de npm.
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          SITE_URL: https://grafiaviles.github.io
          BASE_PATH: /lms-certimedia-landing
          # Entrega del formulario vía FormSubmit (destinatario principal).
          # La copia (CC) a clopez@ se envía desde el cliente (_cc).
          PUBLIC_FORM_ENDPOINT: https://formsubmit.co/ajax/caviles@certimedia.cl
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
